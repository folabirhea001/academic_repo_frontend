<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - AI Academic Repository</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light-purple">

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-purple fixed-top shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            AI Academic Repository
        </a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-label="Toggle navigation"
            title="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="login.html">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="forgot-password.html">
                        Forgot Password
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Forgot Password Section -->
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <h2 class="text-purple fw-bold">Reset Your Password</h2>
                        <p class="text-muted">
                            Enter your email address and we'll send you a
                            password reset link.
                        </p>
                    </div>

                    <form onsubmit="event.preventDefault(); showMessage('Password reset link sent to your email.');">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email"
                                   class="form-control"
                                   placeholder="Enter your registered email"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-purple w-100 py-2">
                            Send Reset Link
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-0">
                            Remember your password?
                            <a href="login.html"
                               class="text-purple fw-semibold text-decoration-none">
                                Back to Login
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="footer text-center py-4 mt-5">
    <p class="mb-0">© 2026 AI Academic Repository</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
