<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — SMART Academic Repository</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="s-auth">
  <div class="s-auth-card" style="max-width:480px;">
    <div class="s-auth-logo"><i class="bi bi-person-plus-fill"></i></div>
    <h4 class="text-center fw-bold mb-1" style="color:#2d1b5e;">Create Account</h4>
    <p class="text-center mb-4" style="color:#7c6fa0;font-size:0.88rem;">Join the SMART Academic Repository — FUTMinna</p>

    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" id="fullName" class="form-control" placeholder="e.g. Afolabi Victoria Boluwatife" required>
      </div>
      <div class="row g-2 mb-3">
        <div class="col-7">
          <label class="form-label">Matric Number</label>
          <input type="text" id="matricNo" class="form-control" placeholder="2021/1/84096CF" required>
        </div>
        <div class="col-5">
          <label class="form-label">Level</label>
          <select id="level" class="form-select" required>
            <option value="">Select</option>
            <option value="100">100 Level</option>
            <option value="200">200 Level</option>
            <option value="300">300 Level</option>
            <option value="400">400 Level</option>
            <option value="500">500 Level</option>
          </select>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Department</label>
        <input type="text" id="department" class="form-control" value="Information Technology" readonly style="background:#f7f4ff !important;color:#7c6fa0;">
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Create a password" required>
      </div>
      <button type="submit" id="registerBtn" class="s-btn w-100" style="justify-content:center;padding:12px;">
        <i class="bi bi-person-check-fill"></i> Create Account
      </button>
    </form>

    <p class="text-center mt-3 mb-2" style="font-size:0.86rem;color:#7c6fa0;">
      Already have an account? <a href="login.html" style="color:#6f42c1;font-weight:700;text-decoration:none;">Login here</a>
    </p>
    <div class="p-2 rounded-3 text-center" style="background:#f7f4ff;border:1px solid #e0d8f5;font-size:0.74rem;color:#7c6fa0;">
      <i class="bi bi-shield-check me-1"></i>Your data is only used to personalise your learning experience (NDPR compliant).
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
<script>
if (getToken() && getRole() === 'student') window.location.href = 'student-dashboard.html';
document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('registerBtn');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';
  try {
    const data = await registerStudent({
      fullName: document.getElementById('fullName').value.trim(),
      matricNo: document.getElementById('matricNo').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
      level: Number(document.getElementById('level').value),
      department: document.getElementById('department').value
    });
    setSession(data.token, data.student, 'student');
    showAlert('Account created! Redirecting...');
    setTimeout(() => window.location.href = 'student-dashboard.html', 1400);
  } catch (err) { showAlert(err.message, 'danger'); btn.disabled = false; btn.innerHTML = orig; }
});
</script>
</body>
</html>
