<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — SMART Academic Repository</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="s-auth" style="background:linear-gradient(135deg,#0c0620 0%,#2d1b5e 60%,#1a0a38 100%);">
  <div class="s-auth-card">
    <div class="s-auth-logo" style="background:linear-gradient(135deg,#dc3545,#9b1c2e);">
      <i class="bi bi-shield-lock-fill"></i>
    </div>
    <h4 class="text-center fw-bold mb-1" style="color:#2d1b5e;">Admin Access</h4>
    <p class="text-center fw-semibold mb-4" style="color:#dc3545;font-size:0.85rem;">
      Restricted — Authorised Personnel Only
    </p>

    <form id="adminForm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <div style="position:relative;">
          <i class="bi bi-person-badge" style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#7c6fa0;"></i>
          <input type="text" id="username" class="form-control" style="padding-left:38px !important;" placeholder="Admin username" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <div style="position:relative;">
          <i class="bi bi-key" style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#7c6fa0;"></i>
          <input type="password" id="password" class="form-control" style="padding-left:38px !important;" placeholder="Admin password" required>
        </div>
      </div>
      <button type="submit" id="adminBtn" class="s-btn w-100" style="justify-content:center;padding:12px;">
        <i class="bi bi-shield-check"></i> Login as Admin
      </button>
    </form>

    <p class="text-center mt-3 mb-0" style="font-size:0.84rem;">
      <a href="login.html" style="color:#7c6fa0;text-decoration:none;"><i class="bi bi-arrow-left me-1"></i>Back to Student Login</a>
    </p>
  </div>
</div>
<script src="api.js"></script>
<script src="app.js"></script>
<script>
if (getToken() && getRole() === 'admin') window.location.href = 'admin-dashboard.html';
document.getElementById('adminForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('adminBtn');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verifying...';
  try {
    const data = await loginAdmin({ username: document.getElementById('username').value.trim(), password: document.getElementById('password').value });
    setSession(data.token, data.admin, 'admin');
    showAlert('Welcome, Admin!');
    setTimeout(() => window.location.href = 'admin-dashboard.html', 1200);
  } catch (err) { showAlert(err.message, 'danger'); btn.disabled = false; btn.innerHTML = orig; }
});
</script>
</body>
</html>
